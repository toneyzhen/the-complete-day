name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate food data
        run: python scripts/validate.py
      - name: index.html matches src/ + data/
        run: |
          python build.py
          git diff --exit-code index.html || { echo "::error::index.html is stale - run python build.py and commit it"; exit 1; }
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Solver smoke test
        run: node tests/smoke.js
